<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 344" width="1000" height="344" role="img" aria-label="Agents nenwa connects, grouped by how a message reaches them"><title>Agents nenwa connects, grouped by how a message reaches them</title><defs><marker id="ad97757" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker><marker id="a6a9bcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a9bcc"/></marker><marker id="a788c5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#788c5d"/></marker><marker id="a6b6a64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a64"/></marker></defs><rect x="1" y="1" width="998" height="342" rx="24" fill="#faf9f5" stroke="none" stroke-width="1.5"/><circle cx="52" cy="57" r="7" fill="#d97757"/><text x="72" y="63" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141413" text-anchor="start">Wakes an idle conversation</text><text x="72" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6a64" text-anchor="start">The message starts a turn by itself.</text><rect x="430" y="40" width="138" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="446" cy="57" r="4" fill="#d97757"/><text x="456" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Claude Code</text><rect x="578" y="40" width="82" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="594" cy="57" r="4" fill="#d97757"/><text x="604" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Codex</text><rect x="670" y="40" width="110" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="686" cy="57" r="4" fill="#d97757"/><text x="696" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">OpenCode</text><rect x="790" y="40" width="55" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="806" cy="57" r="4" fill="#d97757"/><text x="816" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Pi</text><rect x="430" y="84" width="110" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="446" cy="101" r="4" fill="#d97757"/><text x="456" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Grok Bot</text><line x1="40" y1="135" x2="960" y2="135" stroke="#d5d2c5" stroke-width="1"/><circle cx="52" cy="169" r="7" fill="#6a9bcc"/><text x="72" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141413" text-anchor="start">Arrives at the next step</text><text x="72" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6a64" text-anchor="start">Delivered when the agent next runs a tool or stops.</text><rect x="430" y="152" width="92" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="446" cy="169" r="4" fill="#6a9bcc"/><text x="456" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Cursor</text><rect x="532" y="152" width="138" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="548" cy="169" r="4" fill="#6a9bcc"/><text x="558" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Copilot CLI</text><rect x="680" y="152" width="129" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="696" cy="169" r="4" fill="#6a9bcc"/><text x="706" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Gemini CLI</text><rect x="430" y="196" width="176" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="446" cy="213" r="4" fill="#6a9bcc"/><text x="456" y="218" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Antigravity CLI</text><rect x="616" y="196" width="120" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="632" cy="213" r="4" fill="#6a9bcc"/><text x="642" y="218" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Qwen Code</text><line x1="40" y1="247" x2="960" y2="247" stroke="#d5d2c5" stroke-width="1"/><circle cx="52" cy="281" r="7" fill="#788c5d"/><text x="72" y="287" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141413" text-anchor="start">Reads its inbox</text><text x="72" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b6a64" text-anchor="start">Delivered when it calls check_inbox.</text><rect x="430" y="264" width="73" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="446" cy="281" r="4" fill="#788c5d"/><text x="456" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">Muse</text><rect x="513" y="264" width="166" height="34" rx="17" fill="#f0eee6" stroke="#d5d2c5" stroke-width="1.5"/><circle cx="529" cy="281" r="4" fill="#788c5d"/><text x="539" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#141413" text-anchor="start">any MCP client</text></svg>
