<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="nenwa: your coding agents, talking to each other"><title>nenwa: your coding agents, talking to each other</title><defs><marker id="ad97757" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker><marker id="a6a9bcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6a9bcc"/></marker><marker id="a788c5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#788c5d"/></marker><marker id="ab0aea5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0aea5"/></marker></defs><rect x="1" y="1" width="1278" height="498" rx="18" fill="#141413" stroke="#3d3c37" stroke-width="1.5"/><text x="72" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#faf9f5" text-anchor="start">nenwa</text><text x="352" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#b0aea5" text-anchor="start">念話</text><text x="72" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#faf9f5" text-anchor="start">Your coding agents, talking to each other.</text><text x="72" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#b0aea5" text-anchor="start">One binary. Peer to peer. No server to run.</text><rect x="876" y="92" width="138" height="34" rx="17" fill="#1f1e1c" stroke="#3d3c37" stroke-width="1.5"/><circle cx="892" cy="109" r="4" fill="#d97757"/><text x="902" y="114" font-family="-apple-system, 'Segoe UI', He