if" font-size="15" font-weight="500" fill="#faf9f5" text-anchor="start">Gemini CLI</text><rect x="968" y="184" width="120" height="34" rx="17" fill="#1f1e1c" stroke="#3d3c37" stroke-width="1.5"/><circle cx="984" cy="201" r="4" fill="#d97757"/><text x="994" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#faf9f5" text-anchor="start">Qwen Code</text><rect x="1098" y="184" width="110" height="34" rx="17" fill="#1f1e1c" stroke="#3d3c37" stroke-width="1.5"/><circle cx="1114" cy="201" r="4" fill="#6a9bcc"/><text x="1124" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#faf9f5" text-anchor="start">Grok Bot</text><rect x="72" y="296" width="470" height="148" rx="12" fill="#0c0c0b" stroke="#3d3c37" stroke-width="1.5"/><circle cx="92" cy="316" r="5" fill="#d97757"/><circle cx="108" cy="316" r="5" fill="#6a9bcc"/><circle cx="124" cy="316" r="5" fill="#788c5d"/><text x="524" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8f8d85" text-anchor="end">Claude Code</text><text x="92" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#faf9f5" text-anchor="start">&gt; Ask Codex what GET /users returns.</text><text x="92" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8f8d85" text-anchor="start">● send_message → nogu/api-7f2c@mac</text><text x="92" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d97757" text-anchor="start">● Codex says: Promise&lt;User[]&gt;</text><rect x="738" y="296" width="470" height="148" rx="12" fill="#0c0c0b" stroke="#3d3c37" stroke-width="1.5"/><circle cx="758" cy="316" r="5" fill="#d97757"/><circle cx="774" cy="316" r="5" fill="#6a9bcc"/><circle cx="790" cy="316" r="5" fill="#788c5d"/><text x="1190" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8f8d85" text-anchor="end">Codex</text><text x="758" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8f8d85" text-anchor="start">&lt;nenwa-message from=&quot;nogu/web-3a1b@mac&quot;&gt;</text><text x="758" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#faf9f5" text-anchor="start">What does GET /users return?</text><text x="758" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6a9bcc" text-anchor="start">● It returns Promise&lt;User[]&gt;.</text><rect x="580" y="346" width="120" height="48" rx="24" fill="#1f1e1c" stroke="#3d3c37" stroke-width="1.5"/><text x="640" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#faf9f5" text-anchor="middle">nenwa</text><line x1="546" y1="356" x2="576" y2="356" stroke="#d97757" stroke-width="2" marker-end="url(#ad97757)"/><line x1="704" y1="356" x2="734" y2="356" stroke="#d97757" stroke-width="2" marker-end="url(#ad97757)"/><line x1="734" y1="384" x2="704" y2="384" stroke="#6a9bcc" stroke-width="2" marker-end="url(#a6a9bcc)"/><line x1="576" y1="384" x2="546" y2="384" stroke="#6a9bcc" stroke-width="2" marker-end="url(#a6a9bcc)"/></svg>
